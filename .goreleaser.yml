version: 2
project_name: pathman

builds:
  - id: pathman
    main: ./cmd/pathman
    binary: pathman
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - windows
    goarch:
      - amd64
      - "386"
      - arm64

archives:
  - id: zip
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^version:"
      - "^docs:"
      - "^test:"
      - "^Merge "

release:
  github:
    owner: cumulus13
    name: pathman
