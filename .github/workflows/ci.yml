name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, platform-neutral checks + cross-compile of every Windows target.
  portable:
    name: Portable tests + cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test platform-neutral packages (race)
        run: go test -race -count=1 ./internal/config/... ./internal/backup/...
      - name: Cross-compile and vet for Windows
        run: |
          for arch in amd64 386 arm64; do
            echo "::group::windows/$arch"
            GOOS=windows GOARCH=$arch go build -trimpath ./...
            echo "::endgroup::"
          done
          GOOS=windows go vet ./...

  # Real Windows: build, vet, full tests, then an end-to-end run against the
  # runner's registry (throw-away PM_CI_* variables, temp backup folder).
  windows:
    name: Windows build, tests and e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o build/pathman.exe ./cmd/pathman
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: End-to-end (registry, backup, restore)
        shell: pwsh
        run: ./.github/scripts/e2e.ps1 -Exe build/pathman.exe
      - uses: actions/upload-artifact@v7
        with:
          name: pathman-windows-amd64
          path: build/pathman.exe
          retention-days: 7

  # Build the NSIS installers (warnings are errors) ...
  installer-build:
    name: Build installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nsis
      - name: Build pathman.exe and installers (amd64, 386, arm64)
        run: |
          mkdir -p build/bin build/installers
          for arch in amd64 386 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o build/bin/$arch/pathman.exe ./cmd/pathman
            makensis -V2 -WX               -DVERSION=0.0.0-ci -DVERSION_NUM=0.0.0.0 -DARCH=$arch               -DEXE="$PWD/build/bin/$arch/pathman.exe" -DSRCDIR="$PWD"               -DOUTFILE="$PWD/build/installers/pathman_0.0.0-ci_windows_${arch}_setup.exe"               installer/pathman.nsi
          done
          ls -la build/installers
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: build/installers/*.exe
          retention-days: 7

  # ... and really install / upgrade / uninstall them on Windows.
  installer-e2e:
    name: Installer end-to-end (Windows)
    needs: installer-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: installers
      - name: Install, upgrade, uninstall
        shell: pwsh
        run: ./.github/scripts/installer-e2e.ps1 -SetupDir installers

