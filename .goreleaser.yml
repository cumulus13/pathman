version: 2
project_name: pathman

builds:
  - id: pathman
    main: ./cmd/pathman
    binary: pathman
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - windows
    goarch:
      - amd64
      - "386"
      - arm64
    hooks:
      # One NSIS installer per architecture (needs `makensis` on PATH).
      # {{ .Path }} is absolute (<repo>/dist/<target>/pathman.exe); NSIS resolves
      # relative paths from installer/, so every path is passed absolute.
      post:
        - cmd: >-
            makensis -V2 -WX
            -DVERSION={{ .Version }}
            -DVERSION_NUM={{ .Major }}.{{ .Minor }}.{{ .Patch }}.0
            -DARCH={{ .Arch }}
            -DEXE={{ .Path }}
            -DSRCDIR={{ dir (dir (dir .Path)) }}
            -DOUTFILE={{ dir (dir .Path) }}/pathman_{{ .Version }}_windows_{{ .Arch }}_setup.exe
            installer/pathman.nsi

archives:
  - id: zip
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/*_setup.exe

changelog:
  sort: asc
  filters:
    exclude:
      - "^version:"
      - "^docs:"
      - "^test:"
      - "^Merge "

release:
  github:
    owner: cumulus13
    name: pathman
  extra_files:
    - glob: dist/*_setup.exe
